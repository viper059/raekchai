name: ดึงข้อมูลจาก Wikidata

on:
  schedule:
    - cron: '17 20 * * *'   # ทุกวัน 03:17 น. เวลาไทย
  workflow_dispatch:
    inputs:
      mode:
        description: 'seed = ดึงทั้งหมด, daily = เรื่องใหม่ + อัปเดตเรื่องเก่า, ids = เฉพาะเรื่อง'
        type: choice
        options: [daily, seed, ids]
        default: daily
      ids:
        description: 'ใช้กับโหมด ids เช่น Q20948236,Q106582931'
        required: false

concurrency:
  group: import-wikidata
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node test/wikidata.test.mjs
      - name: Import
        run: node scripts/import-wikidata.mjs ${{ inputs.mode || 'daily' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IDS: ${{ inputs.ids }}
